id: image_generation
name: 图片生成
version: 0.1.0
enabled: true
description: 使用 VerySadai 生成图片，并通过现有群聊或私聊回复发送。
entrypoint: qq_social_agent.tools.image_generation
permissions:
  - tool.image_generation
capabilities:
  tools:
